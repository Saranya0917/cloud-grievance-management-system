<!DOCTYPE html>
<html>

<head>
    <title>Reset Password - Grievance Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <h1>Reset Password</h1>

        <p>
            Enter your registered student email address.
        </p>

        <form id="forgotPasswordForm">

            <label for="email">Email:</label>

            <input
                type="email"
                id="email"
                required
            >

            <button type="submit">
                Send Verification Code
            </button>

        </form>

        <p id="message"></p>

        <div id="resetSection" style="display: none;">

            <hr>

            <h2>Enter Verification Code</h2>

            <form id="confirmResetForm">

                <label for="code">
                    Verification Code:
                </label>

                <input
                    type="text"
                    id="code"
                    required
                >

                <label for="newPassword">
                    New Password:
                </label>

                <input
                    type="password"
                    id="newPassword"
                    required
                >

                <label for="confirmPassword">
                    Confirm Password:
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    required
                >

                <button type="submit">
                    Reset Password
                </button>

            </form>

        </div>

        <br>

        <a href="login.html?role=student">
            Back to Student Login
        </a>

    </div>

    <script src="js/auth.js?v=5"></script>

</body>

</html>
